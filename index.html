<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="theme-color" content="#E8743B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>识谱小达人 · 音符随机训练器</title>
<style>
:root{
  --bg:#f6f3ec; --card:#fffdf8; --ink:#2f2a25; --muted:#8a8078;
  --line:#d8d0c4; --accent:#e07a3f; --accent2:#3f7d8c;
  --ok:#4a9d6a; --bad:#d1584f; --shadow:0 2px 14px rgba(80,65,50,.10);
  --r:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100vh; padding:12px 12px 40px;
  display:flex; justify-content:center;
}
.wrap{width:100%; max-width:560px}

/* ---- 顶部 ---- */
header{display:flex; align-items:center; gap:10px; padding:6px 2px 12px}
.logo{width:38px;height:38px;flex:none}
h1{font-size:19px;margin:0;letter-spacing:.5px}
.sub{font-size:11px;color:var(--muted);margin-top:2px}

/* ---- 卡片 ---- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}

/* ---- 分数条 ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stat{background:#fbf7f0;border-radius:12px;padding:9px 4px}
.stat b{display:block;font-size:20px;line-height:1.15}
.stat span{font-size:10px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)} .stat.acc b{color:var(--accent2)}

/* ---- 设置行 ---- */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:10px}
.lbl{font-size:12px;color:var(--muted);min-width:38px}
.chip{
  border:1.5px solid var(--line); background:#fff; color:var(--ink);
  padding:6px 13px;border-radius:20px;font-size:13px;cursor:pointer;
  font-family:inherit;transition:.15s; white-space:nowrap;
  display:inline-flex;align-items:center
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip:active{transform:scale(.94)}
/* 谱号按钮里的谱号预览图（跟着文字颜色变，选中时反白） */
.chip svg{margin-right:3px}
.chip.on svg path,.chip.on svg circle,.chip.on svg ellipse{fill:#fff}
.chip.on svg path[stroke],.chip.on svg line{stroke:#fff}

/* ---- 谱面 ---- */
.staffbox{background:#fff;border-radius:12px;padding:6px 0;margin:14px 0 6px;border:1px solid var(--line)}
svg{display:block;width:100%;height:auto}
.qtitle{text-align:center;font-size:15px;font-weight:600;margin:2px 0 0}
.qtitle .hint{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:3px}

/* ---- 选项 ---- */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{
  border:2px solid var(--line);background:#fff;border-radius:14px;
  padding:16px 8px;text-align:center;cursor:pointer;font-family:inherit;
  font-size:26px;font-weight:700;color:var(--ink);transition:.14s; position:relative
}
.opt small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:3px}
.opt:active{transform:scale(.96)}
.opt.right{border-color:var(--ok);background:#eaf6ee;color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:#fdeceb;color:var(--bad);animation:shake .32s}
.opt.lock{pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---- 反馈 ---- */
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px;display:none;line-height:1.65}
.fb.show{display:block;animation:fade .25s}
.fb.good{background:#eaf6ee;color:#2f6b45}
.fb.err{background:#fdeceb;color:#8f3a33}
.fb b{font-size:19px}
.fb svg{display:inline-block;width:auto;vertical-align:-3px}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
.kb{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
kbd{background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-family:inherit;font-size:11px}

.nbtn{
  width:100%;margin-top:12px;padding:14px;border:none;border-radius:14px;
  background:var(--accent);color:#fff;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit
}
.nbtn:active{transform:scale(.98)}
.ghost{background:#fff;color:var(--muted);border:1.5px solid var(--line);font-weight:600}
.grow{flex:1}
.ctl{width:44px;height:44px;flex:none;border-radius:50%;border:none;background:var(--accent2);color:#fff;font-size:18px;cursor:pointer;font-family:inherit}
.ctl.off{background:#c9c1b6}
.playwrap{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 4px}
.replay{font-size:12px;color:var(--accent2);background:none;border:none;cursor:pointer;font-family:inherit;text-decoration:underline}

/* ---- 结算 ---- */
.result{text-align:center;padding:8px 0}
.result .big{font-size:44px;font-weight:800;color:var(--accent)}
.result h3{margin:6px 0 4px;font-size:18px}
.miss{text-align:left;font-size:13px;color:var(--muted);margin-top:10px;line-height:1.9}
.miss b{color:var(--ink)}
.hidden{display:none !important}
.fold{font-size:12px;color:var(--muted);margin-top:10px;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:rgba(47,42,37,.94);color:#fff;padding:11px 18px;border-radius:22px;font-size:13px;
  opacity:0;pointer-events:none;transition:.25s;z-index:99
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="1" y="1" width="38" height="38" rx="11" fill="#e07a3f"/>
      <g stroke="#fff" stroke-width="1.6" opacity=".9">
        <path d="M8 13h24M8 19h24M8 25h24"/>
      </g>
      <ellipse cx="16" cy="28" rx="5" ry="4" fill="#fff" transform="rotate(-20 16 28)"/>
      <path d="M21 27V17l6-2" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>识谱小达人</h1>
      <div class="sub">随机音符 · 升降记号 · 五线谱训练</div>
    </div>
  </header>

  <div class="card">
    <div class="stats">
      <div class="stat ok"><b id="sOk">0</b><span>答对</span></div>
      <div class="stat bad"><b id="sBad">0</b><span>答错</span></div>
      <div class="stat acc"><b id="sAcc">—</b><span>正确率</span></div>
      <div class="stat"><b id="sStreak">0</b><span>连对</span></div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="lbl">谱号</span>
      <button class="chip" data-clef="treble"><span class="clefIcon" data-icon="treble"></span>高音</button>
      <button class="chip" data-clef="bass"><span class="clefIcon" data-icon="bass"></span>低音</button>
      <button class="chip" data-clef="alto"><span class="clefIcon" data-icon="alto"></span>中音</button>
    </div>
    <div class="row">
      <span class="lbl">难度</span>
      <button class="chip" data-diff="1">入门</button>
      <button class="chip" data-diff="2">进阶</button>
      <button class="chip" data-diff="3">挑战</button>
    </div>
    <div class="row">
      <span class="lbl">题型</span>
      <button class="chip" data-mode="read">看谱选名</button>
      <button class="chip" data-mode="listen">听音点谱</button>
      <button class="chip" data-mode="solfege">选唱名</button>
    </div>
    <div class="row">
      <span class="lbl">选项</span>
      <button class="chip" id="cAlter">升降记号</button>
      <button class="chip" id="cDur">四分音符</button>
      <button class="chip" id="cGuide">辅助线</button>
      <button class="chip" id="cSnd">音效</button>
    </div>
  </div>

  <div class="card" id="quizCard">
    <div class="qtitle" id="qTitle">看谱，选出正确的音名</div>
    <div class="staffbox" id="staffBox"></div>
    <div class="playwrap hidden" id="playWrap">
      <button class="ctl" id="playBtn">▶</button>
      <button class="replay" id="replayBtn">再听一次</button>
    </div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="kb"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> 选择 · <kbd>空格</kbd> 下一题</div>
    <button class="nbtn" id="nextBtn">下一题</button>
  </div>

  <div class="card hidden" id="endCard">
    <div class="result">
      <div class="big" id="endScore">0</div>
      <h3 id="endTitle">完成一轮！</h3>
      <div style="font-size:13px;color:var(--muted)" id="endSub"></div>
      <div class="miss hidden" id="missBox"></div>
      <button class="fold hidden" id="foldBtn">查看错题 ▾</button>
      <div class="row" style="justify-content:center;margin-top:16px">
        <button class="nbtn grow ghost" id="restartBtn">再来一轮</button>
        <button class="nbtn grow" id="contBtn">继续练习</button>
      </div>
      <div class="row" style="justify-content:center;margin-top:10px">
        <button class="nbtn grow ghost" id="drillBtn">🎯 重练本轮错题</button>
      </div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
/* ===== 乐理核心（来自 theory.js，已通过 105 项单元测试） ===== */
/* ============ 乐理核心模块（可被 Node 测试） ============ */
const THEORY = (() => {
  const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const SEMIS = [0, 2, 4, 5, 7, 9, 11];
  const SOLFEGE_FIXED = ['do', 're', 'mi', 'fa', 'sol', 'la', 'si'];

  // 谱号定义：ref 为参考音的 diatonic，off 为其在半格坐标中的位置
  const CLEFS = {
    treble: { name: '高音谱号', ref: 4 * 7 + 4, off: 2, sym: '𝄞' },   // G4 在第二线
    bass: { name: '低音谱号', ref: 3 * 7 + 3, off: 6, sym: '𝄢' },      // F3 在第四线
    alto: { name: '中音谱号', ref: 4 * 7 + 0, off: 4, sym: '𝄡' },     // C4 在第三线
  };

  const dia = (n) => ({ letter: n % 7, octave: Math.floor(n / 7) });

  /** 音对象 -> 五线谱半格位置 p（0=第一线，每+1 上移半格） */
  function pos(note, clef) {
    const d = note.octave * 7 + note.letter;
    return d - CLEFS[clef].ref + CLEFS[clef].off;
  }

  /** 半格位置 -> 音对象（不含升降） */
  function noteAt(p, clef) {
    const d = p + CLEFS[clef].ref - CLEFS[clef].off;
    return dia(d);
  }

  /** 加线：返回需要绘制的半格坐标数组 */
  function ledgerLines(p) {
    const out = [];
    if (p < 0) for (let q = -2; q >= p; q -= 2) out.push(q);
    if (p > 8) for (let q = 10; q <= p; q += 2) out.push(q);
    return out;
  }

  /** MIDI 音高（含升降） */
  function midi(n) {
    return (n.octave + 1) * 12 + SEMIS[n.letter] + (n.alter || 0);
  }

  /** 频率 Hz */
  function freq(n) {
    return 440 * Math.pow(2, (midi(n) - 69) / 12);
  }

  /** 音名文本，如 C4 / F♯4 / B♭3 */
  function name(n) {
    const a = n.alter || 0;
    return LETTERS[n.letter] + (a > 0 ? '♯' : a < 0 ? '♭' : '') + n.octave;
  }

  /** 首调唱名（简谱级数），C大调 */
  function solfege(n) {
    const a = n.alter || 0;
    const s = SOLFEGE_FIXED[n.letter];
    if (a > 0) return s + '#';
    if (a < 0) return s + 'b';
    return s;
  }

  /** 减号记号后的唱名，供选项使用 */
  const accidentalText = (a) => (a > 0 ? '♯' : a < 0 ? '♭' : '');

  /** 在给定音域内随机生成一个音（含升降约束） */
  function randomNote(lowDia, highDia, allowAlter, rng = Math.random) {
    const d = lowDia + Math.floor(rng() * (highDia - lowDia + 1));
    const n = dia(d);
    n.alter = 0;
    if (allowAlter && rng() < 0.45) {
      // 避免把 E/F/B 降号或 C#F#B# 等极少见组合塞给孩子
      const bad = new Set(['Cb', 'E#', 'Fb', 'B#', 'Cb#']);
      const cand = rng() < 0.5 ? 1 : -1;
      const key = LETTERS[n.letter] + (cand > 0 ? '♯' : '♭');
      if (!bad.has(key)) n.alter = cand;
    }
    return n;
  }

  /** 生成干扰项：与正确答案同八度、不同的音高 */
  function makeDistractors(correct, clef, count, lowDia, highDia, rng = Math.random) {
    const set = new Set();
    const key = (n) => `${n.letter}${n.octave}${n.alter || 0}`;
    set.add(key(correct));
    const pool = [];
    // 优先同音名不同升降，其次相邻音高
    const cD = correct.octave * 7 + correct.letter;
    for (let d = -3; d <= 3; d++) {
      if (d === 0) continue;
      const t = dia(cD + d);
      if (t.octave < 0 || t.octave > 8) continue;
      t.alter = 0;
      pool.push(t);
    }
    for (const a of [-1, 1]) {
      const t = { letter: correct.letter, octave: correct.octave, alter: a };
      if (Math.abs(a) > 1) continue;
      pool.push(t);
    }
    while (pool.length < count) {
      const t = randomNote(lowDia, highDia, false, rng);
      pool.push(t);
    }
    shuffle(pool, rng);
    const out = [];
    for (const t of pool) {
      if (out.length >= count) break;
      if (set.has(key(t))) continue;
      set.add(key(t));
      out.push(t);
    }
    return out;
  }

  function shuffle(arr, rng = Math.random) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  /** 某谱号下的"易读音域"（半格坐标范围） */
  const RANGES = {
    treble: { easy: [0, 4], mid: [-2, 10], hard: [-8, 14] },
    bass: { easy: [4, 8], mid: [2, 12], hard: [-2, 16] },
    alto: { easy: [2, 6], mid: [0, 8], hard: [-4, 12] },
  };

  return {
    LETTERS, SEMIS, CLEFS, RANGES, dia, pos, noteAt, ledgerLines,
    midi, freq, name, solfege, accidentalText, randomNote, makeDistractors, shuffle,
  };
})();

/* ================= 应用逻辑 ================= */
const $ = (id) => document.getElementById(id);
const INK = '#2f2a25';
const U2SPACE = GLYPH.space;          // SMuFL：1 个线间距 = 250 字体单位
let   SP = 30;                        // 当前线间距(px)，按谱面纵向范围自适应
const GSC = () => SP / U2SPACE;       // 字体单位 -> px 的缩放系数
/** 字形宽度（单位：线间距） */
const GW = (n) => GLYPH.glyphs[n].xMax / U2SPACE;
/** 谱位 -> 画布 y。p=0 为第一线、p=8 为第五线，每 +1 上移半格 */
const yOf = (p) => SP * (6.6 - 0.5 * p);

/* SMuFL engravingDefaults：线宽与加线伸出量（单位＝线间距） */
const LW = { staff: 0.13, stem: 0.12, ledger: 0.16, ledgerExt: 0.4 };

const CLEF_GLYPH = { treble: 'gClef', bass: 'fClef', alto: 'cClef' };
const HEAD_GLYPH = { quarter: 'noteheadBlack', eighth: 'noteheadBlack',
                     half: 'noteheadHalf', whole: 'noteheadWhole' };
const ACC_GLYPH = { '1': 'accidentalSharp', '-1': 'accidentalFlat', '0': 'accidentalNatural' };

/* ---- 状态 ---- */
// 音的规范化唯一标识。必须用模板字符串：数字相加会造成 B4 与 A5 同 key 的冲突。
const nKey = (n) => `${n.letter}|${n.octave}|${n.alter || 0}`;

const DIFFS = {
  1: { lo: 0,  hi: 4,  alter: false, name: '入门', tip: '只在第一线到第三线，音符都在五线内' },
  2: { lo: -2, hi: 10, alter: true,  name: '进阶', tip: '全部五线 + 高音区，含升降记号' },
  3: { lo: -4, hi: 14, alter: true,  name: '挑战', tip: '上下加线全部出现，音域最宽' },
};
const ST = { clef: 'treble', diff: 2, mode: 'read', alter: true, dur: 'quarter', guide: false, sound: true };
const DUR_LABEL = { quarter: '四分音符', half: '二分音符', eighth: '八分音符' };
let cur = null, locked = false, score = { ok: 0, bad: 0 }, streak = 0, bestStreak = 0, roundNo = 0;
let drilling = false;           // 是否处于"错题重练"模式
const wrongBook = [];      // 本轮错题：{letter, octave, alter, clef}

/* ---- 音频：Web Audio 合成，无需外部文件 ---- */
let AC = null;
function ac() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; AC = new C(); }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, dur = 0.7, gain = 0.22, when = 0) {
  if (!ST.sound) return;
  const a = ac(), t = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain(), o2 = a.createOscillator(), g2 = a.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  o2.type = 'sine'; o2.frequency.value = f * 2;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  g2.gain.setValueAtTime(0, t);
  g2.gain.linearRampToValueAtTime(gain * 0.25, t + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.7);
  o.connect(g).connect(a.destination); o2.connect(g2).connect(a.destination);
  o.start(t); o.stop(t + dur); o2.start(t); o2.stop(t + dur);
}
function playNote(n, dur = 0.7) { tone(THEORY.freq(n), dur); }
function sfx(ok) {
  if (!ST.sound) return;
  if (ok) { tone(660, 0.12, 0.18); tone(880, 0.18, 0.18, 0.09); }
  else { tone(200, 0.22, 0.16); tone(150, 0.3, 0.14, 0.1); }
}
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ================= 矢量绘制 ================= */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

/** 绘制一个 SMuFL 字形，使其原点落在 (x,y)。data-glyph 便于校验与调试 */
function glyph(name, x, y, k = 1) {
  const g = GLYPH.glyphs[name];
  const s = GSC() * k;
  return `<path data-glyph="${name}" d="${g.d}" transform="translate(${x},${y}) scale(${s},${-s})" fill="${INK}"/>`;
}

/** 谱号：原点即它标记的那条线，直接落在 yOf(off) 上 */
function clefSvg(clef, x) {
  return glyph(CLEF_GLYPH[clef], x, yOf(THEORY.CLEFS[clef].off));
}

/**
 * 变音记号：置于符头左侧，右缘距符头左缘 0.22 个线间距（常规排版间距）。
 * @param a 1=升号 -1=降号 0=还原号
 */
function accSvg(a, cx, p) {
  const name = ACC_GLYPH[String(a)];
  if (!name) return '';
  const headHalf = GW(HEAD_GLYPH[ST.dur]) / 2 * SP;
  return glyph(name, cx - headHalf - 0.22 * SP - GW(name) * SP, yOf(p));
}

/** 符头：以音符的谱位为中心左右居中 */
function noteHead(cx, p, dur) {
  const name = HEAD_GLYPH[dur] || 'noteheadBlack';
  return glyph(name, cx - GW(name) * SP / 2, yOf(p));
}

/**
 * 符干（含八分音符符尾）。符干贴符头一侧：向上的符干在符头右缘，向下的在左缘；
 * 中线以下符干向上，其余向下。
 */
function noteStem(cx, p, dur) {
  if (dur === 'whole') return '';
  const w = GW(HEAD_GLYPH[dur]) * SP;
  const up = p < 4;
  const sx = (up ? cx + w / 2 : cx - w / 2).toFixed(1);
  const y0 = yOf(p) + (up ? -0.168 : 0.168) * SP;
  const y1 = y0 + (up ? -3.4 : 3.4) * SP;
  let s = `<path d="M ${sx},${y0.toFixed(1)} L ${sx},${y1.toFixed(1)}" stroke="${INK}"
    stroke-width="${(LW.stem * SP).toFixed(2)}" stroke-linecap="butt"/>`;
  if (dur === 'eighth') s += glyph(up ? 'flag8thUp' : 'flag8thDown', +sx, y1);
  return s;
}

/**
 * 生成可内联进 HTML 的小图标（按钮 / 提示文字用），同样不依赖任何字体。
 * 字形名以 notehead 开头时自动补上符干。
 * @param name 字形名
 * @param px   图标高度（像素）
 * @param fill 填充色
 */
function miniGlyph(name, px, fill = INK) {
  const g = GLYPH.glyphs[name];
  const withStem = /^notehead/.test(name) && name !== 'noteheadWhole';
  const TH = 30, LEN = 750;            // 符干线宽 / 长度（字体单位）
  const top = withStem ? g.yMax + LEN : g.yMax;
  const boxH = top - g.yMin;
  const k = px / boxH;
  const stem = withStem
    ? `<path d="M ${g.xMax - TH / 2} ${g.yMin + 20} L ${g.xMax - TH / 2} ${top}"
         stroke="${fill}" stroke-width="${TH}" fill="none"/>`
    : '';
  return `<svg viewBox="${g.xMin} ${-top} ${g.xMax - g.xMin} ${boxH}"
    width="${(g.xMax * k).toFixed(2)}" height="${px}" aria-hidden="true"
    preserveAspectRatio="xMinYMid meet"><g transform="scale(1,-1)">
    <path d="${g.d}" fill="${fill}"/>${stem}</g></svg>`;
}

/**
 * 渲染谱面。
 * 纵向可见范围 = 五线谱范围 ∪ 音符（含变音记号高度）∪ 谱号本体，三者取并集，
 * 并按此自适应线间距 —— 这样任何音符、任何谱号都不会被裁到画布外。
 */
function renderStaff() {
  const { clef, diff, dur, guide, mode } = ST;
  const lo = DIFFS[diff].lo, hi = DIFFS[diff].hi;
  const cur_ = cur;
  if (!cur_) return '';
  const p = cur_.p;

  const W = 420, LX = 28, NX = 250;

  /* --- 先算出"需要多高"，据此决定线间距 --- */
  const clefG = GLYPH.glyphs[CLEF_GLYPH[clef]];
  const needs = (sp) => {
    const y = (q) => sp * (6.6 - 0.5 * q);
    const padN = (DIFFS[diff].alter && ST.alter ? 1.45 : 0.55) * sp;  // 升号最高约 1.4 个线间距
    const off = THEORY.CLEFS[clef].off;
    const cTop = y(off) - clefG.yMax / U2SPACE * sp;
    const cBot = y(off) - clefG.yMin / U2SPACE * sp;
    const top = Math.min(y(hi + 1) - padN, cTop) - sp / 2;
    const bot = Math.max(y(lo - 1) + padN, cBot) + sp / 2;
    return { top, h: bot - top };
  };
  const HMAX = 340;                       // 谱面框最大高度（画布单位）
  const probe = needs(30);
  SP = probe.h > HMAX ? Math.max(19, 30 * HMAX / probe.h) : 30;
  const box = needs(SP);
  const boxTop = box.top.toFixed(1), boxH = box.h.toFixed(1);

  const ny = yOf(p);
  let g = '';

  // 五线：只有 p=0/2/4/6/8 五个偶数位是"线"，奇数是"间"（不画线）
  g += `<g stroke="${INK}" stroke-width="${(LW.staff * SP).toFixed(2)}" stroke-linecap="butt">`;
  for (let q = 8; q >= 0; q -= 2)
    g += `<path d="M 22,${yOf(q).toFixed(1)} L ${W - 22},${yOf(q).toFixed(1)}"/>`;
  g += `</g>`;

  // 加线：长度 = 符头宽 + 两侧各 0.4 个线间距
  const ledHalf = (GW('noteheadBlack') / 2 + LW.ledgerExt) * SP;
  const led = THEORY.ledgerLines(p);
  if (led.length) {
    g += `<g stroke="${INK}" stroke-width="${(LW.ledger * SP).toFixed(2)}" stroke-linecap="butt">`;
    for (const q of led)
      g += `<path d="M ${(NX - ledHalf).toFixed(1)},${yOf(q).toFixed(1)} L ${(NX + ledHalf).toFixed(1)},${yOf(q).toFixed(1)}"/>`;
    g += `</g>`;
  }

  // 谱号
  g += clefSvg(clef, LX);

  // 辅助线：每条线对应的音名
  if (guide) {
    const names = guideNames(clef);
    g += `<g font-size="${(SP * 0.38).toFixed(1)}" fill="#b0a69a" font-family="sans-serif">`;
    for (let q = 0; q <= 8; q += 2)
      if (names[q])
        g += `<text x="${W - 26}" y="${(yOf(q) + SP * 0.13).toFixed(1)}" text-anchor="middle">${esc(names[q])}</text>`;
    g += `</g>`;
  }

  // 听音模式：待点击位置的热区
  if (mode === 'listen' && !locked) {
    for (let q = lo; q <= hi; q++) {
      const n = THEORY.noteAt(q, clef);
      const nn = { letter: n.letter, octave: n.octave, alter: cur_.alter };
      g += `<g class="hit" data-name="${esc(THEORY.name(nn))}" style="cursor:pointer">
        <rect x="${(NX - 1.3 * SP).toFixed(1)}" y="${(yOf(q) - SP / 2).toFixed(1)}"
              width="${(2.6 * SP).toFixed(1)}" height="${SP.toFixed(1)}" fill="transparent"/>
      </g>`;
    }
    g += `<text x="${NX}" y="${(box.top + SP * 0.8).toFixed(1)}" text-anchor="middle"
      font-size="${(SP * 0.4).toFixed(1)}" fill="#c3b9ac" font-family="sans-serif">点我选位置</text>`;
  }

  // 音符本体：非听音模式直接显示；听音模式答错后揭示
  if (mode !== 'listen' || (locked && !cur_.isRight)) {
    if (cur_.alterOn) g += accSvg(cur_.alter, NX, p);
    g += noteStem(NX, p, dur) + noteHead(NX, p, dur);
  }

  // 对错标记：圈出该音符的正确位置
  if (locked) {
    g += `<circle cx="${NX}" cy="${ny.toFixed(1)}" r="${(1.15 * SP).toFixed(1)}" fill="none"
      stroke="${cur_.isRight ? '#4a9d6a' : '#d1584f'}" stroke-width="${(SP * 0.1).toFixed(1)}"
      opacity="${cur_.isRight ? 0.95 : 0.85}"/>`;
  }

  return `<svg viewBox="0 ${boxTop} ${W} ${boxH}" role="img" aria-label="五线谱">${g}</svg>`;
}

// 辅助线音名：从下往上每条线/间的音（不含加线）
function guideNames(clef) {
  const out = {};
  for (let q = 0; q <= 8; q++) {
    const n = THEORY.noteAt(q, clef);
    out[q] = THEORY.LETTERS[n.letter] + n.octave;
  }
  return out;
}

/* ---- 出题 ---- */
/**
 * 难度区间（半格坐标）-> 精确的 diatonic 区间。
 * 必须取 lo / hi 两点本身的 diatonic，不能按"整个八度"取，
 * 否则会随机出落在五线谱绘图范围之外的音（音符就会看不见）。
 */
function diaRange(clef, lo, hi) {
  const a = THEORY.noteAt(lo, clef), b = THEORY.noteAt(hi, clef);
  const da = a.octave * 7 + a.letter, db = b.octave * 7 + b.letter;
  return [Math.min(da, db), Math.max(da, db)];
}

function newQuestion() {
  const d = DIFFS[ST.diff];
  const clef = ST.clef;
  const [lowDia, hiDia] = diaRange(clef, d.lo, d.hi);
  const note = THEORY.randomNote(lowDia, hiDia, d.alter && ST.alter);
  const alterOn = !!note.alter && ST.alter;
  cur = { note, p: THEORY.pos(note, clef), alter: alterOn ? note.alter : 0, alterOn, isRight: null, chosen: null };
  locked = false;
  render();
}

function render() {
  const mode = ST.mode;
  const titles = {
    read: '看谱，选出正确的<b>音名</b>',
    listen: '先听声音，再在谱上<b>点出位置</b>',
    solfege: '看谱，选出正确的<b>唱名</b>',
  };
  $('qTitle').innerHTML = titles[mode] +
    `<span class="hint">${DIFFS[ST.diff].name} · ${THEORY.CLEFS[ST.clef].name} · ${ST.alter ? '含升降记号' : '无升降记号'}</span>`;
  $('staffBox').innerHTML = renderStaff();
  $('playWrap').classList.toggle('hidden', mode !== 'listen');
  $('nextBtn').classList.toggle('hidden', !locked);
  $('nextBtn').textContent = '下一题 →';

  const o = $('opts');
  if (mode === 'listen') {
    o.classList.add('hidden');
    bindHits();
  } else {
    o.classList.remove('hidden');
    buildOptions();
  }
  // 未作答时清空上一题的反馈，避免旧提示停留在新题上
  if (locked) showFeedback();
  else { const fb = $('fb'); fb.className = 'fb'; fb.innerHTML = ''; }
  updateStats();
}

function buildOptions() {
  const box = $('opts'); box.innerHTML = '';
  const clef = ST.clef, d = DIFFS[ST.diff];
  const [lowDia, highDia] = diaRange(clef, d.lo, d.hi);
  let items;
  if (ST.mode === 'read') {
    const ds = THEORY.makeDistractors(cur.note, clef, 3, lowDia, highDia);
    items = THEORY.shuffle([cur.note, ...ds]).map(n => ({
      key: nKey(n), main: THEORY.name(n), sub: '',
    }));
  } else {
    const list = [];
    const use = THEORY.shuffle([cur.note, ...THEORY.makeDistractors(cur.note, clef, 3, lowDia, highDia)]);
    for (const n of use) {
      const k = nKey(n);
      if (list.some(x => x.key === k)) continue;
      list.push({ key: k, main: THEORY.solfege(n), sub: THEORY.name(n) });
      if (list.length === 4) break;
    }
    items = THEORY.shuffle(list);
  }
  items.forEach((it) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `${esc(it.main)}${it.sub ? `<small>${esc(it.sub)}</small>` : ''}`;
    b.dataset.key = it.key;
    b.onclick = () => answer(it.key, b);
    box.appendChild(b);
  });
}

function bindHits() {
  document.querySelectorAll('#staffBox .hit').forEach(h => {
    h.onclick = () => {
      if (locked) return;
      answerByPos(h.dataset.name, h);
    };
  });
}

function answer(key, btn) {
  if (locked) return;
  finish(key === nKey(cur.note), btn);
}
function answerByPos(nameStr, el) {
  if (locked) return;
  finish(nameStr === THEORY.name(cur.note), el);
}

function finish(right, el) {
  if (locked) return;
  locked = true;
  cur.isRight = right;
  score[right ? 'ok' : 'bad']++;
  if (right) { streak++; bestStreak = Math.max(bestStreak, streak); }
  else {
    streak = 0;
    // 记录错题（含谱号与难度，便于针对性重练）
    if (!cur.keyed) { cur.keyed = 1; wrongBook.push({ ...cur.note, clef: ST.clef }); }
  }
  sfx(right);

  const correctKey = nKey(cur.note);
  document.querySelectorAll('#opts .opt').forEach(b => {
    b.classList.add('lock');
    if (b.dataset.key === correctKey) b.classList.add('right');
    if (b === el && !right) b.classList.add('wrong');
  });
  $('staffBox').innerHTML = renderStaff();
  if (ST.mode === 'listen') bindHits();
  $('nextBtn').classList.remove('hidden');
  showFeedback();
  updateStats();
}

function showFeedback() {
  const fb = $('fb');
  const n = cur.note;
  const zone = cur.p < 0 ? '下加线区' : cur.p > 8 ? '上加线区' : '五线内';
  // 记号用真实字形内联，避免依赖特殊字符字体
  const acc = cur.alterOn
    ? `${cur.alter > 0 ? '升号' : '降号'} ${miniGlyph(ACC_GLYPH[String(cur.alter)], 15)}`
    : '自然音（无升降）';
  fb.className = 'fb show ' + (cur.isRight ? 'good' : 'err');
  fb.innerHTML = cur.isRight
    ? `<b>答对啦！🎉</b>　这是 <b>${esc(THEORY.name(n))}</b>（${esc(THEORY.solfege(n))}）<br>
       <span style="opacity:.8">${acc} · ${zone}</span>`
    : `<b>再想想～</b>　正确答案是 <b>${esc(THEORY.name(n))}</b>（${esc(THEORY.solfege(n))}）<br>
       <span style="opacity:.8">${acc}${ST.mode === 'listen' ? ' · 已在谱上圈出' : ''}</span>`;
}

/* ---- 统计 ---- */
function updateStats() {
  $('sOk').textContent = score.ok;
  $('sBad').textContent = score.bad;
  const t = score.ok + score.bad;
  $('sAcc').textContent = t ? Math.round(score.ok / t * 100) + '%' : '—';
  $('sStreak').textContent = streak;
}
function toastBest() {
  try {
    const b = Math.max(bestStreak, +(localStorage.getItem('srb_best') || 0));
    localStorage.setItem('srb_best', b);
    if (bestStreak >= b && bestStreak >= 5) toast(`🏅 新纪录！连对 ${bestStreak} 题`);
  } catch (e) {}
}

/* ---- 一轮结束 ---- */
const ROUND = 10;
function checkRound() {
  if (score.ok + score.bad < ROUND) return;
  if ($('endCard').classList.contains('hidden') === false) return;
  roundNo++;
  const acc = Math.round(score.ok / (score.ok + score.bad) * 100);
  $('endScore').textContent = acc + '%';
  $('endTitle').textContent = acc >= 90 ? '太厉害了！' : acc >= 70 ? '进步很大！' : '继续加油！';
  $('endSub').textContent = `本轮 ${ROUND} 题 · 答对 ${score.ok} 题 · 最高连对 ${bestStreak} 题`;

  // 错题本：给家长/孩子一个明确的复习清单
  const mb = $('missBox'), fold = $('foldBtn');
  const uniq = [], seen = new Set();
  for (const w of wrongBook) {
    const k = `${w.letter}|${w.octave}|${w.alter}|${w.clef}`;
    if (seen.has(k)) continue;
    seen.add(k); uniq.push(w);
  }
  if (uniq.length) {
    mb.innerHTML = '<b>本轮错题（' + uniq.length + ' 个，建议逐个重练）</b><br>' +
      uniq.map(w => {
        const nn = { letter: w.letter, octave: w.octave, alter: w.alter };
        const mark = w.alter ? miniGlyph(ACC_GLYPH[String(w.alter)], 14) : '';
        return `· <b>${esc(THEORY.name(nn))}</b>${mark}（${esc(THEORY.solfege(nn))}）@ ${esc(THEORY.CLEFS[w.clef].name)}`;
      }).join('<br>');
    fold.classList.remove('hidden');
    fold.textContent = '查看错题 ▾';
    mb.classList.add('hidden');
  } else {
    fold.classList.add('hidden');
    mb.classList.add('hidden');
  }

  $('quizCard').classList.add('hidden');
  $('endCard').classList.remove('hidden');
  toastBest();
  if (acc === 100) { sfx(true); setTimeout(() => sfx(true), 200); }
}

/* ---- 错题重练：只出做错过的音 ---- */
function drillWrong() {
  const pool = wrongBook.filter(w => !w.done);
  const src = pool.length ? pool : wrongBook;
  if (!src.length) {
    toast('本轮没有错题，太棒了！');
    drilling = false;
    resetRound();
    return;
  }
  for (const w of src) w.done = false;
  const w = src[Math.floor(Math.random() * src.length)];
  w.done = true;
  drilling = true;
  ST.clef = w.clef;
  syncChips();
  $('endCard').classList.add('hidden');
  $('quizCard').classList.remove('hidden');
  locked = false;
  // ST.alter 关闭时不带升降，保持题干与判题一致
  const alter = ST.alter ? (w.alter || 0) : 0;
  const note = { letter: w.letter, octave: w.octave, alter };
  cur = { note, p: THEORY.pos(note, ST.clef), alter, alterOn: !!alter,
          isRight: null, chosen: null, keyed: 1 };
  render();
}

/* ---- 设置交互 ---- */
function bindChips(attr, key, after) {
  document.querySelectorAll(`[data-${attr}]`).forEach(b => {
    b.onclick = () => {
      document.querySelectorAll(`[data-${attr}]`).forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      ST[key] = isNaN(+b.dataset[attr]) ? b.dataset[attr] : +b.dataset[attr];
      after && after();
    };
  });
}
function syncChips() {
  const set = (attr, val) => document.querySelectorAll(`[data-${attr}]`).forEach(b =>
    b.classList.toggle('on', b.dataset[attr] === String(val)));
  set('clef', ST.clef); set('diff', ST.diff); set('mode', ST.mode);
  const t = {
    cAlter: [ST.alter, '升降记号'], cGuide: [ST.guide, '辅助线'], cSnd: [ST.sound, '音效'],
  };
  for (const id in t) $(id).classList.toggle('on', t[id][0]);
  $('cDur').classList.add('on');
  $('cDur').innerHTML = miniGlyph(HEAD_GLYPH[ST.dur], 17) + DUR_LABEL[ST.dur];
}

bindChips('clef', 'clef', newQuestion);
bindChips('diff', 'diff', newQuestion);
bindChips('mode', 'mode', newQuestion);
$('cAlter').onclick = () => { ST.alter = !ST.alter; syncChips(); newQuestion(); };
$('cDur').onclick = () => {
  const seq = ['quarter', 'half', 'eighth'];
  ST.dur = seq[(seq.indexOf(ST.dur) + 1) % 3]; syncChips(); render();
};
$('cGuide').onclick = () => { ST.guide = !ST.guide; syncChips(); render(); };
$('cSnd').onclick = () => { ST.sound = !ST.sound; syncChips(); if (ST.sound) playNote(cur.note); };
$('playBtn').onclick = () => playNote(cur.note, 0.9);
$('replayBtn').onclick = () => playNote(cur.note, 0.9);
$('nextBtn').onclick = () => {
  if (drilling) { drillWrong(); return; }
  checkRound();
  if ($('endCard').classList.contains('hidden') === false) return;
  newQuestion();
};
$('restartBtn').onclick = () => { drilling = false; resetRound(); };
$('drillBtn').onclick = () => drillWrong();
$('contBtn').onclick = () => {
  drilling = false;
  $('endCard').classList.add('hidden'); $('quizCard').classList.remove('hidden');
  streak = 0; newQuestion();
};
$('foldBtn').onclick = () => {
  const b = $('missBox'); b.classList.toggle('hidden');
  $('foldBtn').textContent = b.classList.contains('hidden') ? '查看错题 ▾' : '收起错题 ▴';
};

function resetRound() {
  score = { ok: 0, bad: 0 }; streak = 0; wrongBook.length = 0;
  $('endCard').classList.add('hidden'); $('quizCard').classList.remove('hidden');
  newQuestion();
}

/* ---- 键盘 ---- */
document.addEventListener('keydown', (e) => {
  if (ST.mode === 'listen') { if (e.key === ' ' && locked) $('nextBtn').click(); return; }
  const bs = document.querySelectorAll('#opts .opt');
  if (['1', '2', '3', '4'].includes(e.key)) {
    const b = bs[+e.key - 1]; if (b && !b.classList.contains('lock')) b.click();
  }
  if (e.key === ' ' && locked) $('nextBtn').click();
});

/* ---- 启动 ---- */
// 谱号按钮上用真实字形做预览（同样不依赖字体）
document.querySelectorAll('.clefIcon').forEach(el => {
  el.innerHTML = miniGlyph(CLEF_GLYPH[el.dataset.icon], 22, INK);
});
syncChips();
newQuestion();
render();
// 首次交互解锁音频（浏览器策略）
document.addEventListener('pointerdown', () => ac(), { once: true });
</script>
